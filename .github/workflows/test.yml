name: Test

on:
    push:
    
jobs:
    build:
        runs-on: ubuntu-20.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Node
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: 'npm'

            - name: Get packages
              run: npm ci

            - name: Test
              run: npm test
              env:
                TZ: Europe/Berlin
            
