name: Test

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Get packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Knip
        run: pnpm run knip

      - name: Typescript
        run: pnpm run tsc

      - name: Dependencies
        run: pnpm run dependencies:ci

      - name: Test
        run: pnpm run test:nowatch
        env:
          CI: true
          TZ: Europe/Berlin
