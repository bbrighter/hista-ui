name: Test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Get packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Knip
        run: pnpm run knip

      - name: Dependencies
        run: pnpm run dependencies:ci

      - name: Test
        run: pnpm test
        env:
          TZ: Europe/Berlin
